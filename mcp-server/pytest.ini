[pytest]
# Pytest configuration for AI Movie Planner tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -W ignore::DeprecationWarning
    --color=yes
    --code-highlight=yes

# Test markers (use with @pytest.mark.{marker})
markers =
    unit: Unit tests that don't require external services
    integration: Integration tests that may call external APIs (mocked)
    slow: Tests that take longer to run
    bug: Tests that document and prevent specific bugs (e.g., MISSING_MOVIE)
    llm: Tests that involve LLM behavior (always mocked)

# Coverage options (optional, requires pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=frontend --cov=movie_mcp_server --cov-report=html --cov-report=term

# Logging
log_cli = false
log_cli_level = INFO
